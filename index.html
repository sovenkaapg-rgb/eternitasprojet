<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- Удалите старые строки 7 и 8, и оставьте только эту одну: -->
    <script src="js/main.js" type="module"></script>

    <title>Aeternitas project</title>
</head>
<body>    
    <!-- Задний фон сайта -->
    <div class="bg"></div>    
    
    <!-- Верхняя анимированная лента -->
    <div class="lines"></div>

    <!-- ГЛАВНОЕ ОКНО ПОРТАЛА -->
    <div class="portal-interface" id="portal-screen">
        
        <!-- Описание тайтла и стрелочки навигации -->
        <div class="title-description-zone">
            <div class="title-navigation-row">
                <button class="nav-arrow-btn" id="prev-title-btn">◀</button>
                <h1 id="current-title-name">Загрузка...</h1>
                <button class="nav-arrow-btn" id="next-title-btn">▶</button>
            </div>
            <p id="current-title-synopsis">Описание комикса подгрузится автоматически.</p>
        </div>

        <!-- Лента глав, которая крутится колесиком -->
        <div class="chapters-list" id="chapters-list-container"></div>
    </div>

    <!-- ОКНО ЧИТАЛКИ -->
    <div class="reader-overlay" id="comic-reader">
         <div class="read-progress-bar">
        <div id="read-progress-fill" class="read-progress-fill"></div> </div>
        <!-- ВСТАВИТЬ СЮДА: Кнопка быстрого закрытия главы -->
    <button id="close-reader-btn" class="close-reader-btn" title="Закрыть главу">×</button>
        <div class="reader-pages" id="reader-pages-container"></div>
    </div>

    <!-- 👁️ Кнопка-глаз Секретного Архива (в правом верхнем углу) -->
   <button class="archive-eye-btn" id="archive-eye-btn">
       <img src="imgR/sol.webp" alt="Архив" class="eye-graphic">
       <span class="archive-indicator" id="archive-indicator"></span>
  </button>
<!-- боковое меню -->
   <div id="archive-sidebar" class="archive-sidebar">
    <button id="close-archive-btn" class="close-archive-btn">×</button>
    <h2 class="archive-sidebar-title">Секретный Архив</h2>
    
    <!-- ОЧИЩЕННЫЙ БЛОК ПЕРЕКЛЮЧЕНИЯ ТАБОВ -->
    <div class="archive-tabs-nav">
        <button class="archive-tab-btn active" data-tab="lore">Досье</button>
        <button class="archive-tab-btn" data-tab="artifacts">Предметы</button>
        <button class="archive-tab-btn" data-tab="chat">Эфир</button>
    </div>

    <div id="documents-grid" class="documents-grid"></div>
</div>


    <!-- Уведомление об обновлении базы данных -->
<div id="game-alert" class="game-alert-toast">
  <div class="game-alert-content">
    <span class="game-alert-icon">📝</span>
    <span id="game-alert-text">База данных обновлена!</span>
  </div>
</div>


<script type="text/javascript"></script>
    
</body>
</html>
